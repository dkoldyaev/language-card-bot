version: '3.8'

services:
  app:
    extends:
      file: docker-compose.yml
      service: app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-testuser}:${POSTGRES_PASSWORD:-testpass}@db_test:5432/${POSTGRES_DB:-english_card_bot_test}?schema=public
      - REDIS_URL=redis://redis_test:6379
      - DEFINER_APP_TYPE=mock
    depends_on:
      - db_test
      - redis_test

  mercure:
    extends:
      file: docker-compose.yml
      service: mercure

  db_test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-testuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testpass}
      POSTGRES_DB: ${POSTGRES_DB:-english_card_bot_test}
    ports:
      - "5433:5432"

  redis_test:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  translator:
    extends:
      file: docker-compose.yml
      service: translator
    environment:
      - MOCK_TIMEOUT=0

  definer:
    extends:
      file: docker-compose.yml
      service: definer
    environment:
      - MOCK_TIMEOUT=0

  mercure_monitor:
    build:
      context: ./mercure-monitor
    environment:
      - MERCURE_URL=${BASE_MERCURE_URL}
      - MERCURE_JWT_KEY=${MERCURE_JWT_KEY}
    depends_on:
      - mercure

  frontend:
    extends:
      file: docker-compose.yml
      service: frontend

    depends_on:
      - app

