version: '3.8'

services:
  app:
    build:
      context: ./base
      target: ${BASE_TARGET}
    environment:
      - DATABASE_URL=${BASE_DATABASE_URL:-postgresql://postgres:kdtkxd7yoq20rxyh@englishcards-db-cfcixo:5432/postgres?schema=public}
      - JWT_SECRET=${BASE_JWT_SECRET:-supersecret_docker_key}
      - PORT=${BASE_PORT:-3001}
      - MERCURE_URL=${BASE_MERCURE_URL:-http://mercure/.well-known/mercure}
      - MERCURE_JWT=${BASE_MERCURE_JWT:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJtZXJjdXJlIjp7InB1Ymxpc2giOlsiKiJdfSwiaWF0IjoxNzg3Njk0ODEyfQ.tmkgmm48l6GAnxBkxG4bz-KfjjwNdPV-t5DROZmsa9s}
      - MERCURE_JWT_KEY=${MERCURE_JWT_KEY:-supersecret_mercure_key}
      - TRANSLATOR_API_URL=${BASE_TRANSLATOR_API_URL:-http://translator:3001/api/v1/translate}
      - DEFINER_API_URL=${BASE_DEFINER_API_URL:-http://definer:3002/api/v1/define}
      - DEFINER_APP_TYPE=${BASE_DEFINER_APP_TYPE:-mock}
      - TRANSLATOR_APP_TYPE=${BASE_TRANSLATOR_APP_TYPE:-mock}
      - BASE_DOMAIN=${BASE_DOMAIN:-https://language-cards.194-163-164-255.nip.io}
      - REDIS_URL=${BASE_REDIS_URL:-redis://redis:6379}
      - CORS_ORIGIN=${BASE_CORS_ORIGIN:-https://language-cards.194-163-164-255.nip.io}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mercure:
    image: dunglas/mercure
    environment:
      - SERVER_NAME=${MERCURE_SERVER_NAME:-:80}
      - MERCURE_PUBLISHER_JWT_KEY=${MERCURE_JWT_KEY:-supersecret_mercure_key}
      - MERCURE_SUBSCRIBER_JWT_KEY=${MERCURE_JWT_KEY:-supersecret_mercure_key}
      - CORS_ALLOWED_ORIGINS=${MERCURE_CORS_ALLOWED_ORIGINS:-*}
      - ALLOW_ANONYMOUS=${MERCURE_ALLOW_ANONYMOUS:-1}

  translator:
    build:
      context: ./translator
      target: ${TRANSLATOR_TARGET}
    environment:
      - PORT=${TRANSLATOR_PORT:-3001}
      - TRANSLATOR_APP_TYPE=${BASE_TRANSLATOR_APP_TYPE:-mock}
      - GOOGLE_TRANSLATE_API_KEY=${TRANSLATOR_GOOGLE_TRANSLATE_API_KEY:-}
      - MOCK_TIMEOUT=${TRANSLATOR_MOCK_TIMEOUT:-10}
      - LARA_ACCESS_KEY_ID=${TRANSLATOR_LARA_ACCESS_KEY_ID:-89FQ452N18RC7J67A1R6MO0MO7}
      - LARA_ACCESS_KEY_SECRET=${TRANSLATOR_LARA_ACCESS_KEY_SECRET:-2Z_XQ-7oN-40b3vLqonUlVm4vu7xPmAAkxXvwBSFtZA}
      - CACHE_URL=${TRANSLATOR_CACHE_URL:-redis://redis:6379/1}


  definer:
    build:
      context: ./definer
      target: ${DEFINER_TARGET}
    environment:
      - PORT=${DEFINER_PORT:-3002}
      - DEFINER_APP_TYPE=${BASE_DEFINER_APP_TYPE:-freedictionary}
      - MISTRAL_API_KEY=${DEFINER_MISTRAL_API_KEY:-nOKbvR0ZFtGuOGLZAG22eiDD5QP07p1O}
      - GEMINI_API_KEY=${DEFINER_GEMINI_API_KEY:-}
      - MOCK_TIMEOUT=${DEFINER_MOCK_TIMEOUT:-10}
      - CACHE_URL=${DEFINER_CACHE_URL:-redis://redis:6379/2}


  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  frontend:
    build:
      context: ./frontend
      target: ${FRONTEND_TARGET}
      args:
        - PORT=${FRONTEND_PORT}
    environment:
      - PORT=${FRONTEND_PORT:-5173}
      - VITE_API_BASE_URL=${FRONTEND_VITE_API_BASE_URL:-https://language-cards.194-163-164-255.nip.io/api/v1}
      - VITE_MERCURE_PUBLIC_URL=${FRONTEND_VITE_MERCURE_PUBLIC_URL:-https://language-cards.194-163-164-255.nip.io/.well-known/mercure}
      - VITE_BASE_DOMAIN=${FRONTEND_VITE_BASE_DOMAIN:-https://language-cards.194-163-164-255.nip.io}
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}


volumes:
  redis_data:

