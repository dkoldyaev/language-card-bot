version: '3.8'

services:
  app:
    build:
      context: ./base
      target: development
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=${BASE_DATABASE_URL}
      - JWT_SECRET=${BASE_JWT_SECRET}
      - PORT=${BASE_PORT}
      - MERCURE_URL=${BASE_MERCURE_URL}
      - MERCURE_JWT=${BASE_MERCURE_JWT}
      - MERCURE_JWT_KEY=${MERCURE_JWT_KEY}
      - TRANSLATOR_API_URL=${BASE_TRANSLATOR_API_URL}
      - DEFINER_API_URL=${BASE_DEFINER_API_URL}
      - DEFINER_APP_TYPE=${BASE_DEFINER_APP_TYPE}
      - TRANSLATOR_APP_TYPE=${BASE_TRANSLATOR_APP_TYPE}
      - BASE_DOMAIN=${BASE_DOMAIN}
      - REDIS_URL=${BASE_REDIS_URL}
      - CORS_ORIGIN=${BASE_CORS_ORIGIN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    volumes:
      - ./base:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mercure:
    image: dunglas/mercure
    environment:
      - SERVER_NAME=${MERCURE_SERVER_NAME}
      - MERCURE_PUBLISHER_JWT_KEY=${MERCURE_JWT_KEY}
      - MERCURE_SUBSCRIBER_JWT_KEY=${MERCURE_JWT_KEY}
      - CORS_ALLOWED_ORIGINS=${MERCURE_CORS_ALLOWED_ORIGINS}
      - ALLOW_ANONYMOUS=${MERCURE_ALLOW_ANONYMOUS}
    ports:
      - "9090:80"

  translator:
    build:
      context: ./translator
      target: development
    ports:
      - "3002:3001"
    environment:
      - PORT=${TRANSLATOR_PORT}
      - TRANSLATOR_APP_TYPE=${BASE_TRANSLATOR_APP_TYPE}
      - GOOGLE_TRANSLATE_API_KEY=${TRANSLATOR_GOOGLE_TRANSLATE_API_KEY}
      - MOCK_TIMEOUT=${TRANSLATOR_MOCK_TIMEOUT}
      - LARA_ACCESS_KEY_ID=${TRANSLATOR_LARA_ACCESS_KEY_ID}
      - LARA_ACCESS_KEY_SECRET=${TRANSLATOR_LARA_ACCESS_KEY_SECRET}
      - CACHE_URL=${TRANSLATOR_CACHE_URL:-redis://redis:6379/1}
    volumes:
      - ./translator:/app
      - /app/node_modules

  definer:
    build:
      context: ./definer
      target: development
    ports:
      - "3003:3002"
    environment:
      - PORT=${DEFINER_PORT}
      - DEFINER_APP_TYPE=${BASE_DEFINER_APP_TYPE}
      - MISTRAL_API_KEY=${DEFINER_MISTRAL_API_KEY}
      - GEMINI_API_KEY=${DEFINER_GEMINI_API_KEY}
      - MOCK_TIMEOUT=${DEFINER_MOCK_TIMEOUT}
      - CACHE_URL=${DEFINER_CACHE_URL:-redis://redis:6379/2}
    volumes:
      - ./definer:/app
      - /app/node_modules

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "5174:5173"
    environment:
      - VITE_API_BASE_URL=${FRONTEND_VITE_API_BASE_URL}
      - VITE_MERCURE_PUBLIC_URL=${FRONTEND_VITE_MERCURE_PUBLIC_URL}
      - VITE_BASE_DOMAIN=${FRONTEND_VITE_BASE_DOMAIN}
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  redis_data:

