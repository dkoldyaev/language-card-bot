version: '3.8'

services:
  app:
    build:
      context: ./base
      target: ${BASE_TARGET}
    environment:
      - DATABASE_URL=${BASE_DATABASE_URL}
      - JWT_SECRET=${BASE_JWT_SECRET}
      - PORT=${BASE_PORT}
      - MERCURE_URL=${BASE_MERCURE_URL}
      - MERCURE_JWT=${BASE_MERCURE_JWT}
      - MERCURE_JWT_KEY=${MERCURE_JWT_KEY}
      - TRANSLATOR_API_URL=${BASE_TRANSLATOR_API_URL}
      - DEFINER_API_URL=${BASE_DEFINER_API_URL}
      - DEFINER_APP_TYPE=${BASE_DEFINER_APP_TYPE}
      - TRANSLATOR_APP_TYPE=${BASE_TRANSLATOR_APP_TYPE}
      - BASE_DOMAIN=${BASE_DOMAIN}
      - REDIS_URL=${BASE_REDIS_URL}
      - CORS_ORIGIN=${BASE_CORS_ORIGIN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - ENABLE_TEST_AUTH=${BASE_ENABLE_TEST_AUTH}
      - LLM_API_URL=${BASE_LLM_API_URL}
      - LLM_PROVIDER=${BASE_LLM_PROVIDER}
      - LLM_MODEL=${BASE_LLM_MODEL}
      - ENABLE_DB_LOGGING=${BASE_ENABLE_DB_LOGGING}
      - ALLOW_GUEST_AI_GENERATION=${BASE_ALLOW_GUEST_AI_GENERATION}
      - GUEST_AI_DAILY_LIMIT=${BASE_GUEST_AI_DAILY_LIMIT}
    depends_on:
      - llm

  mercure:
    image: dunglas/mercure
    environment:
      - SERVER_NAME=${MERCURE_SERVER_NAME}
      - MERCURE_PUBLISHER_JWT_KEY=${MERCURE_JWT_KEY}
      - MERCURE_SUBSCRIBER_JWT_KEY=${MERCURE_JWT_KEY}
      - CORS_ALLOWED_ORIGINS=${MERCURE_CORS_ALLOWED_ORIGINS}
      - ALLOW_ANONYMOUS=${MERCURE_ALLOW_ANONYMOUS}

  translator:
    build:
      context: ./translator
      target: ${TRANSLATOR_TARGET}
    environment:
      - PORT=${TRANSLATOR_PORT}
      - TRANSLATOR_APP_TYPE=${BASE_TRANSLATOR_APP_TYPE}
      - GOOGLE_TRANSLATE_API_KEY=${TRANSLATOR_GOOGLE_TRANSLATE_API_KEY}
      - MOCK_TIMEOUT=${TRANSLATOR_MOCK_TIMEOUT}
      - LARA_ACCESS_KEY_ID=${TRANSLATOR_LARA_ACCESS_KEY_ID}
      - LARA_ACCESS_KEY_SECRET=${TRANSLATOR_LARA_ACCESS_KEY_SECRET}
      - CACHE_URL=${TRANSLATOR_CACHE_URL}
      - LLM_SERVICE_URL=${TRANSLATOR_LLM_SERVICE_URL}
      - LLM_PROVIDER=${TRANSLATOR_LLM_PROVIDER}
      - LLM_MODEL=${TRANSLATOR_LLM_MODEL}
    depends_on:
      - llm

  llm:
    build:
      context: ./llm
      target: ${LLM_TARGET}
    environment:
      - PORT=${LLM_PORT}
      - MISTRAL_API_KEY=${LLM_MISTRAL_API_KEY}
      - GEMINI_API_KEY=${LLM_GEMINI_API_KEY}
      - MOCK_TIMEOUT=${LLM_MOCK_TIMEOUT}
      - CACHE_URL=${LLM_CACHE_URL}

  definer:
    build:
      context: ./definer
      target: ${DEFINER_TARGET}
    environment:
      - PORT=${DEFINER_PORT}
      - DEFINER_APP_TYPE=${BASE_DEFINER_APP_TYPE}
      - LLM_SERVICE_URL=${DEFINER_LLM_SERVICE_URL}
      - LLM_PROVIDER=${DEFINER_LLM_PROVIDER}
      - LLM_MODEL=${DEFINER_LLM_MODEL}
      - MOCK_TIMEOUT=${DEFINER_MOCK_TIMEOUT}
      - CACHE_URL=${DEFINER_CACHE_URL}
      - TRANSLATOR_API_URL=${BASE_TRANSLATOR_API_URL}
      - TRANSLATOR_APP_TYPE=${BASE_TRANSLATOR_APP_TYPE}
    depends_on:
      - llm
      - translator

  frontend:
    build:
      context: ./frontend
      target: ${FRONTEND_TARGET}
      args:
        - PORT=${FRONTEND_PORT}
        - API_BASE_URL=${FRONTEND_API_BASE_URL}
        - MERCURE_PUBLIC_URL=${FRONTEND_MERCURE_PUBLIC_URL}
        - BASE_DOMAIN=${FRONTEND_BASE_DOMAIN}
        - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
        - ALLOWED_HOSTS=${FRONTEND_ALLOWED_HOSTS}
        - AUTH_PROVIDER=${FRONTEND_AUTH_PROVIDER}
    environment:
      - FRONTEND_PORT=${FRONTEND_PORT}
      - API_BASE_URL=${FRONTEND_API_BASE_URL}
      - MERCURE_PUBLIC_URL=${FRONTEND_MERCURE_PUBLIC_URL}
      - BASE_DOMAIN=${FRONTEND_BASE_DOMAIN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - ALLOWED_HOSTS=${FRONTEND_ALLOWED_HOSTS}
      - AUTH_PROVIDER=${FRONTEND_AUTH_PROVIDER}

volumes:
  redis_data:

