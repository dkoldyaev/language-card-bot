version: '3.8'

services:
  app:
    build:
      context: ./base
      target: development
    ports:
      - "3001:3001"
    environment:
      # Use host.docker.internal to connect to the host's PostgreSQL instance
      - DATABASE_URL=postgresql://dkoldaev@host.docker.internal:5432/english_card_bot?schema=public
      - JWT_SECRET=supersecret_docker_key
      - PORT=3001
      - MERCURE_URL=http://mercure/.well-known/mercure
      - MERCURE_JWT=supersecret_mercure_key
      - TRANSLATOR_API_URL=http://translator:3001/api/v1/translate
      - DEFINER_API_URL=http://definer:3002/api/v1/define
      - BASE_DOMAIN=${BASE_DOMAIN:-http://localhost}
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./base:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mercure:
    image: dunglas/mercure
    environment:
      - SERVER_NAME=:80
      - MERCURE_PUBLISHER_JWT_KEY=supersecret_mercure_key
      - MERCURE_SUBSCRIBER_JWT_KEY=supersecret_mercure_key
      - CORS_ALLOWED_ORIGINS=*
      - ALLOW_ANONYMOUS=1
    ports:
      - "9090:80"

  translator:
    build:
      context: ./translator
      target: development
    ports:
      - "3002:3001"
    environment:
      - PORT=3001
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY}
    volumes:
      - ./translator:/app
      - /app/node_modules

  definer:
    build:
      context: ./definer
      target: development
    ports:
      - "3003:3002"
    environment:
      - PORT=3002
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./definer:/app
      - /app/node_modules

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

